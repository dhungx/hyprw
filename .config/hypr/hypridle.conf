# hypridle.conf — quản lý idle: dim màn hình → khoá → tắt màn hình → ngủ đông
# Lưu ý: hypridle KHÔNG dùng cú pháp Lua (chỉ core Hyprland đổi sang Lua),
# file này vẫn giữ định dạng block truyền thống, không cần sửa gì thêm.
#
# Ghi chú quan trọng cho máy gaming: trình duyệt/video player/game thường tự
# giữ "idle-inhibit lock" khi đang phát video hoặc chạy fullscreen — lúc đó
# TOÀN BỘ listener bên dưới tự động tạm dừng, màn hình sẽ không tự khoá giữa
# lúc bạn đang xem phim/chơi game (miễn app đó hỗ trợ chuẩn Wayland idle-inhibit,
# hầu hết trình duyệt và mpv đều có).

general {
    lock_cmd = pidof hyprlock || hyprlock       # tránh mở nhiều hyprlock cùng lúc
    before_sleep_cmd = loginctl lock-session    # khoá máy trước khi ngủ đông
    after_sleep_cmd = hyprctl dispatch dpms on  # bật lại màn hình ngay khi thức dậy
}

# 5 phút không hoạt động — giảm độ sáng màn hình
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 phút — tự khoá máy
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 phút — tắt hẳn màn hình (tiết kiệm pin, máy vẫn chạy)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 20 phút — ngủ đông (chỉ áp dụng khi chạy pin, không cắm sạc theo mặc định
# systemd — nếu muốn áp dụng cả lúc cắm sạc, đổi policy trong logind.conf)
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
