# ~/.config/starship.toml — theme Catppuccin Mocha, đồng bộ với phần còn lại
# của rice. Định dạng cổ điển: user@host:~/path$
# Dùng mã màu hex trực tiếp — không dùng icon glyph phức tạp để tránh rủi ro
# lệch font, tránh bài học đã gặp với icon waybar trước đó.

format = """$username@$hostname:$directory$git_branch$git_status$character"""

[username]
show_always = true
style_user = "bold #a6e3a1"
style_root = "bold #f38ba8"
format = "[$user]($style)"

[hostname]
ssh_only = false
disabled = false
style = "bold #89b4fa"
format = "[$hostname]($style)"

[directory]
style = "bold #f9e2af"
format = "[:$path]($style)"
truncation_length = 3
truncate_to_repo = true
# ~ cho thư mục home đã tự động mặc định (home_symbol), không cần set thêm

[git_branch]
symbol = " "     # U+E0A0 — ký hiệu nhánh git chuẩn, có sẵn trong mọi Nerd Font
style = "#cba6f7"
format = " [$symbol$branch]($style)"

[git_status]
style = "#f38ba8"
format = '([ $all_status$ahead_behind]($style))'

# Dấu cuối dòng — $ cho user thường, tự đổi thành # nếu chạy bằng root
[character]
success_symbol = "[\$](bold #a6e3a1) "
error_symbol = "[\$](bold #f38ba8) "

[cmd_duration]
min_time = 2000
format = " took [$duration](#f9e2af)"
