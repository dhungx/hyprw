# ~/.config/xdg-desktop-portal/portals.conf
# Chỉ định rõ backend cho từng loại portal — tránh trường hợp có nhiều backend
# cùng cài (hyprland + gtk) mà hệ thống chọn nhầm, khiến screen share qua
# Zoom/OBS/Discord không chạy được hoặc hộp thoại chọn file bị lỗi.
#
# hyprland: xử lý ScreenCast/Screenshot (đúng chuẩn Hyprland)
# gtk: dự phòng cho phần Hyprland's portal không tự làm (vd FileChooser)
[preferred]
default=hyprland;gtk
