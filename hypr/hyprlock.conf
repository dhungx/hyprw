# hyprlock.conf — màn hình khoá
# Cũng KHÔNG phải cú pháp Lua — hyprlock là tool riêng, giữ định dạng cũ.

background {
    monitor =
    path = ~/.config/hypr/wallpapers/river_to_castle_theme_blue.jpeg
    blur_passes = 2
    blur_size = 7
    color = rgb(30, 30, 46)   # màu nền dự phòng nếu ảnh không load được
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(137, 180, 250, 0.9)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>Nhập mật khẩu...</i>
    fail_text = <i>Sai rồi, thử lại</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(166, 173, 200, 1)
    font_size = 18
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 1)
    font_size = 16
    position = 0, -30
    halign = center
    valign = center
}
