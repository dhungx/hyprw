# hyprpaper.conf — cấu hình hình nền
# Sửa đường dẫn dưới thành ảnh thật trên máy bạn sau khi cài xong.
# Nếu chưa có ảnh, tạm thời comment (thêm # đầu dòng) 2 dòng preload/wallpaper
# và comment luôn dòng "exec-once = hyprpaper" trong hyprland.lua để tránh lỗi.

preload = ~/Pictures/wallpaper.jpg
wallpaper = ,~/Pictures/wallpaper.jpg

splash = false
