# hyprpaper.conf — cấu hình hình nền
# 8 ảnh có sẵn trong thư mục wallpaper/ của repo — cài xong sẽ nằm ở
# ~/.config/hypr/wallpapers/. Đang đặt mặc định là river_to_castle_theme_blue
# (tông xanh khớp nhất với bảng màu Catppuccin Mocha dùng xuyên suốt rice).
#
# Đổi hình nền: sửa 2 dòng preload/wallpaper bên dưới, chọn 1 trong 8 tên file:
#   apple-waves1.jpeg, apple-light.jpeg, dark-star.jpg,
#   river_to_castle_theme_blue.jpeg, andrew-neel-jtsW--Z6bFw-unsplash.jpeg,
#   dark-waves.jpeg, blueflower.jpeg, blue.jpeg
# Nhớ sửa cùng đường dẫn này trong hyprlock.conf để 2 chỗ khớp nhau.

preload = ~/.config/hypr/wallpapers/river_to_castle_theme_blue.jpeg
wallpaper = ,~/.config/hypr/wallpapers/river_to_castle_theme_blue.jpeg

splash = false
