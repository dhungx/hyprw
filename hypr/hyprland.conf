########################################
# HYPRLAND CONFIG — bản tối thiểu ngày 1
# Mục tiêu: chạy được ngay, không đẹp, thêm dần sau.
# Đọc kỹ comment — mỗi dòng đều có giải thích để bạn hiểu, không chỉ copy.
########################################

# ── Màn hình ──────────────────────────────────────────
# "preferred,auto,1" = dùng độ phân giải khuyến nghị, tự đặt vị trí, scale 1x.
# Sau khi vào máy thật, chạy `hyprctl monitors` xem tên thật (vd eDP-1) rồi sửa dòng dưới
# thành: monitor=eDP-1,1920x1080@144,auto,1  (để chạy đúng 144Hz)
monitor=,preferred,auto,1

# ── Chương trình mặc định (đổi tên ở đây, không cần sửa nhiều chỗ) ──
$terminal = foot
$fileManager = thunar
$menu = fuzzel

# ── Autostart — chạy 1 lần khi Hyprland khởi động ──────
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle
# polkit agent — cần để app xin quyền sudo qua giao diện đồ hoạ hoạt động đúng
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ── Input (bàn phím, touchpad) ──────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Giao diện chung (viền, khoảng cách cửa sổ) ──────────
general {
    gaps_in = 4          # khoảng cách giữa 2 cửa sổ cạnh nhau
    gaps_out = 8         # khoảng cách từ cửa sổ tới mép màn hình
    border_size = 2
    col.active_border = rgba(89b4faee)     # màu viền cửa sổ đang focus
    col.inactive_border = rgba(595959aa)   # màu viền cửa sổ không focus
    layout = dwindle     # kiểu tiling — dwindle là kiểu phổ biến nhất, dễ hiểu nhất
}

# ── Bo góc, hiệu ứng (để tắt blur lúc đầu cho nhẹ) ──────
decoration {
    rounding = 6
    blur {
        enabled = false  # bật true sau nếu máy chạy mượt, để false lúc đầu cho nhẹ
    }
    drop_shadow = false
}

# ── Animation (đơn giản, không tốn tài nguyên) ──────────
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Phím tắt ─────────────────────────────────────────────
# $mainMod = phím Super (phím Windows) — đổi ở đây nếu muốn dùng phím khác
$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive          # đóng cửa sổ đang focus
bind = $mainMod SHIFT, M, exit          # thoát Hyprland (logout)
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating      # bật/tắt chế độ nổi cho cửa sổ đang focus
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, F, fullscreen

# Di chuyển focus giữa các cửa sổ (phím mũi tên)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Chuyển qua workspace 1-10 (phím 0 = workspace 10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Đẩy cửa sổ đang focus qua workspace khác (giữ SHIFT)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Chuyển workspace bằng lăn chuột (khi trỏ chuột ở trên bar/desktop)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Kéo/resize cửa sổ bằng chuột + Super
bindm = $mainMod, mouse:272, movewindow      # chuột trái + Super = kéo
bindm = $mainMod, mouse:273, resizewindow    # chuột phải + Super = resize

# Screenshot (cần cài: grim, slurp, wl-clipboard)
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy

# Volume/Brightness — dùng bindel để nhấn giữ vẫn tăng/giảm liên tục
# (cần cài: wireplumber cho wpctl, brightnessctl)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous

########################################
# CẦN CÀI để file này chạy được (paru -S / pacman -S):
# hyprland waybar dunst hyprpaper hypridle foot thunar fuzzel
# grim slurp wl-clipboard wireplumber brightnessctl playerctl
# hyprpolkitagent (thay cho polkit-kde-authentication-agent-1 nếu dùng bản mới của Hyprland)
########################################
